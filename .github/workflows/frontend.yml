name: Frontend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm exec -- playwright install --with-deps chromium
      - name: Browser regression tests against production build
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/pdflexi-preview.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4173/ > /dev/null; then break; fi
            sleep 1
          done
          TEST_URL=http://localhost:4173 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdflexi-qa
          path: artifacts/qa/
